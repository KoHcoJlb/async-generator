[package]
name = "async-generator-macros"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for the async-generator crate"
readme = "README.md"
keywords = ["async", "generator", "stream", "proc-macro"]
categories = ["asynchronous"]
include = ["src/**", "README.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
syn = { version = "2.0.117", features = ["full", "visit-mut", "extra-traits"] }
quote = "1.0.45"

[lints]
workspace = true
